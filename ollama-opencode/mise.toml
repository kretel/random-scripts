[vars]
# One model tag and description per line, separated by |.
models = """
deepseek-r1:32b|20 GB, reasoning/thinking
qwen3-coder-next:q4_K_M|52 GB, agentic coding; tight on 64 GB
qwen3.8:27b-q8_0|27 GB, high-precision general/coding
qwen3.8-27B-GGUF:UD-Q5_K_M|custom GGUF import, Q5_K_M
qwen3-coder:30b-a3b-q4_K_M|19 GB, fast agentic coding
qwen2.5-coder:32b-instruct-q4_K_M|20 GB, code generation/repair
glm-4.7-flash:q4_K_M|17 GB, fast general purpose
nemotron-3.5-lightning:30b-a3b-q4_K_M|25 GB, agent-focused MoE
llama3:70b-instruct-q4_K_M|43 GB, general purpose; tight on 64 GB
mixtral:8x7b-instruct-v0.1-q4_K_M|28 GB, MoE general purpose
"""
menu_default_model = "nemotron-3.5-lightning:30b-a3b-q4_K_M"
default_model = "deepseek-r1:32b"
ollama_address = "127.0.0.1"
ollama_port = "11435"
ollama_context_length = "32768"
_.file = ".env"

[tasks.select-model]
description = "Select a model to use for local coding"
run = '''
#!/usr/bin/env bash
set -euo pipefail

env_file={{ config_root | quote }}/.env

save_local_var() {
  local key=$1 value=$2 input=/dev/null tmp
  if [[ -f "$env_file" ]]; then
    input=$env_file
  fi
  tmp=$(mktemp "$env_file.XXXXXX") || return 1
  if awk -v key="$key" '
    $0 !~ ("^[[:space:]]*(export[[:space:]]+)?" key "[[:space:]]*=")
  ' "$input" > "$tmp" &&
    printf '%s=%s\n' "$key" "$value" >> "$tmp" &&
    mv -f "$tmp" "$env_file"; then
    return 0
  fi
  rm -f "$tmp"
  printf 'Could not save %s to %s.\n' "$key" "$env_file" >&2
  return 1
}

if [[ $# -gt 1 ]]; then
  printf 'Usage: mise run select-model [model]\n' >&2
  exit 2
fi

if [[ $# -eq 1 ]]; then
  selected_model=$1
else
  menu_default_model={{ vars.menu_default_model | quote }}
  default_choice=0
  next_choice=1
  choices=("quit")
  context_sizes=(32768 65536)

  echo "Available models:"
  while IFS='|' read -r model description; do
    [[ -n $model ]] || continue
    choices[$next_choice]="model:$model"
    printf '%d) %s (%s)\n' "$next_choice" "$model" "$description"
    if [[ $model == "$menu_default_model" ]]; then
      default_choice=$next_choice
    fi
    next_choice=$((next_choice + 1))
  done <<< {{ vars.models | quote }}

  for context_size in "${context_sizes[@]}"; do
    choices[$next_choice]="context:$context_size"
    printf '%d) Set context length to %dK (%d)\n' \
      "$next_choice" "$((context_size / 1024))" "$context_size"
    next_choice=$((next_choice + 1))
  done
  echo "0) Quit"
  echo ""

  read -r -p "Select an option (default now [$default_choice]): " choice
  choice=${choice:-$default_choice}
  selection=
  if [[ $choice != *[!0-9]* && " ${!choices[*]} " == *" $choice "* ]]; then
    selection=${choices[$choice]}
  fi

  case "$selection" in
    model:*) selected_model=${selection#model:} ;;
    context:*)
      context_size=${selection#context:}
      save_local_var ollama_context_length "$context_size"
      echo "Context length updated to: $context_size"
      echo "Run 'mise run opencode' to use it."
      exit 0
      ;;
    quit) echo "No changes made."; exit 0 ;;
    *) echo "Invalid selection" >&2; exit 1 ;;
  esac
fi

if ! command -v ollama >/dev/null 2>&1; then
  printf 'Ollama is required to check and pull %s. Run mise run opencode setup first.\n' "$selected_model" >&2
  exit 1
fi

ollama_host=${OLLAMA_HOST:-127.0.0.1:11435}
server_ready() {
  curl --noproxy '*' --max-time 1 --fail --silent "http://$ollama_host/api/version" >/dev/null 2>&1
}

profile=
ollama_pid=
cleanup() {
  if [[ -n "$ollama_pid" ]]; then
    kill "$ollama_pid" 2>/dev/null || true
    wait "$ollama_pid" 2>/dev/null || true
  fi
  if [[ -n "$profile" ]]; then
    rm -rf -- "$profile"
  fi
}
trap cleanup EXIT

if ! server_ready; then
  profile=$(mktemp -d "${TMPDIR:-/tmp}/mise-select-model.XXXXXX")
  OLLAMA_HOST=$ollama_host ollama serve >"$profile/ollama.log" 2>&1 &
  ollama_pid=$!
  ready=false
  for (( attempt=0; attempt<60; attempt++ )); do
    kill -0 "$ollama_pid" 2>/dev/null || break
    if server_ready; then
      ready=true
      break
    fi
    sleep 1
  done
  if [[ "$ready" != true ]]; then
    cat "$profile/ollama.log" >&2
    printf 'Ollama did not start on %s.\n' "$ollama_host" >&2
    exit 1
  fi
fi

if OLLAMA_HOST=$ollama_host ollama show "$selected_model" >/dev/null 2>&1; then
  printf '%s is already pulled.\n' "$selected_model"
else
  printf '%s is not pulled; pulling now...\n' "$selected_model"
  OLLAMA_HOST=$ollama_host ollama pull "$selected_model"
fi

# Save the selection only after the model is available.
save_local_var default_model "$selected_model"

echo "Model updated to: $selected_model"
echo "Run 'mise run opencode verify' to test it."
'''

[tasks.select-model.env]
OLLAMA_HOST = "{{ vars.ollama_address }}:{{ vars.ollama_port }}"
NO_PROXY = "{{ vars.ollama_address }},localhost"
no_proxy = "{{ vars.ollama_address }},localhost"


[tasks.pre-check]
description = "Check Ollama, OpenCode 2.x, and the local server port"
dir = "{{config_root}}"
quiet = false
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ $# -gt 1 || ( $# -eq 1 && $1 != setup ) ]]; then
  printf 'Usage: mise run pre-check [setup]\n' >&2
  exit 2
fi

if [[ ${1:-} == setup ]]; then
  for package in ollama opencode; do
    if ! command -v "$package" >/dev/null; then
      if ! command -v brew >/dev/null; then
        printf 'Homebrew is required to install %s.\n' "$package" >&2
        exit 1
      fi
      HOMEBREW_NO_INSTALL_CLEANUP=1 brew install "$package"
    fi
  done
fi

for executable in ollama opencode; do
  if ! executable_path=$(command -v "$executable"); then
    printf 'Missing %s. Run mise run opencode setup.\n' "$executable" >&2
    exit 1
  fi
  printf 'Found %s at %s\n' "$executable" "$executable_path"
done

if ! opencode_version=$(opencode --version); then
  printf 'Could not read the OpenCode version.\n' >&2
  exit 1
fi
version_number=${opencode_version#opencode }
case "${version_number#v}" in
  2.*) printf 'OpenCode version: %s (requires 2.x)\n' "$version_number" ;;
  *) printf 'This setup requires OpenCode 2.x; found %s.\n' "$opencode_version" >&2; exit 1 ;;
esac

ollama_port={{ vars.ollama_port | quote }}
if ! command -v lsof >/dev/null; then
  printf 'Missing lsof. Cannot check whether port %s is free.\n' "$ollama_port" >&2
  exit 1
fi
if lsof -nP -iTCP:"$ollama_port" -sTCP:LISTEN >/dev/null; then
  printf 'Port %s is in use. Close the process using it before retrying.\n' "$ollama_port" >&2
  exit 1
fi
printf 'Ollama port %s is free.\n' "$ollama_port"
'''

[tasks.opencode]
description = "Run the local coding stack: mise run opencode [setup|verify|launch]"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail

action=${1:-launch}
case "$action" in
  setup|verify|launch) ;;
  *) printf 'Usage: mise run opencode [setup|verify|launch]\n' >&2; exit 2 ;;
esac
if [[ $# -gt 1 ]]; then
  printf 'Usage: mise run opencode [setup|verify|launch]\n' >&2
  exit 2
fi

if [[ "$action" == setup ]]; then
  mise run pre-check setup
else
  mise run pre-check
fi

model={{ vars.default_model | quote }}
umask 077
profile=$(mktemp -d "${TMPDIR:-/tmp}/mise-local-code.XXXXXX")
ollama_pid=
cleanup() {
  if [[ -n "$ollama_pid" ]]; then
    kill "$ollama_pid" 2>/dev/null || true
    wait "$ollama_pid" 2>/dev/null || true
  fi
  rm -rf -- "$profile"
}
trap cleanup EXIT
trap 'exit 130' INT
trap 'exit 143' TERM

ollama serve >"$profile/ollama.log" 2>&1 &
ollama_pid=$!
ready=false
for (( attempt=0; attempt<60; attempt++ )); do
  kill -0 "$ollama_pid" 2>/dev/null || break
  if grep -Fq "Listening on $OLLAMA_HOST" "$profile/ollama.log" &&
    curl --noproxy '*' --max-time 1 --fail --silent "http://$OLLAMA_HOST/api/version" >/dev/null; then
    ready=true
    break
  fi
  sleep 1
done
if [[ "$ready" == false ]]; then
  cat "$profile/ollama.log" >&2
  printf 'Ollama did not start on %s.\n' "$OLLAMA_HOST" >&2
  exit 1
fi

if [[ "$action" == setup ]] && ! ollama show "$model" >/dev/null 2>&1; then
  ollama pull "$model"
fi
if ! ollama show "$model" >/dev/null; then
  printf 'The local model is unavailable. Run mise run opencode setup.\n' >&2
  exit 1
fi
if [[ "$action" == setup ]]; then
  printf 'Setup complete. Run mise run opencode verify, then mise run opencode.\n'
  exit 0
fi

# Use a private profile and server so existing settings and sessions are not loaded.
mkdir -p "$profile/config/opencode" "$profile/home"
cat > "$profile/config/opencode/opencode.json" <<JSON
{
  "update": "disable",
  "model": "local/qwen",
  "providers": {
    "local": {
      "name": "Ollama (local)",
      "package": "@opencode/ai/providers/openai-compatible",
      "settings": { "baseURL": "http://$OLLAMA_HOST/v1" },
      "models": {
        "qwen": {
          "modelID": "$model",
          "name": "$model",
          "capabilities": { "tools": true },
          "limit": { "context": $OLLAMA_CONTEXT_LENGTH, "output": 4096 }
        }
      }
    }
  },
  "policies": [
    { "action": "provider.use", "resource": "*", "effect": "deny" },
    { "action": "provider.use", "resource": "local", "effect": "allow" }
  ],
  "permissions": [
    { "action": "shell", "resource": "*", "effect": "ask" },
    { "action": "edit", "resource": "*", "effect": "ask" },
    { "action": "external_directory", "resource": "*", "effect": "ask" },
    { "action": "webfetch", "resource": "*", "effect": "ask" },
    { "action": "websearch", "resource": "*", "effect": "ask" }
  ]
}
JSON

run_opencode() {
  env -i PATH="$PATH" HOME="$profile/home" TERM="${TERM:-xterm-256color}" \
    XDG_CONFIG_HOME="$profile/config" XDG_DATA_HOME="$profile/data" \
    XDG_CACHE_HOME="$profile/cache" XDG_STATE_HOME="$profile/state" \
    OPENCODE_DISABLE_PROJECT_CONFIG=1 \
    OPENCODE_CLI_CONFIG_CONTENT='{"session":{"permissions":"prompt"}}' \
    opencode "$@"
}

if [[ "$action" == verify ]]; then
  response=$(run_opencode run --standalone --model local/qwen \
    'Reply with exactly this text and use no tools: LOCAL_QWEN_READY')
  printf '%s\n' "$response"
  if ! grep -Fq LOCAL_QWEN_READY <<<"$response"; then
    printf 'OpenCode did not return the expected local model response.\n' >&2
    exit 1
  fi
  ollama ps
else
  run_opencode --standalone
fi
'''

[tasks.opencode.env]
OLLAMA_HOST = "{{ vars.ollama_address }}:{{ vars.ollama_port }}"
OLLAMA_CONTEXT_LENGTH = "{{ vars.ollama_context_length }}"
OLLAMA_NO_CLOUD = "1"
NO_PROXY = "{{ vars.ollama_address }},localhost"
no_proxy = "{{ vars.ollama_address }},localhost"
